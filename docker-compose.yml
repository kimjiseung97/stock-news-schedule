x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # IMAGE_TAG는 배포 워크플로가 .env에 커밋 SHA로 주입한다(태그를 고정해야 롤백이 가능).
    image: ${IMAGE:-ghcr.io/kimjiseung97/stock-news-schedule}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Seoul
    env_file:
      - .env
    # 배포 스크립트가 호스트에서 헬스체크(curl localhost:4000/health)를 하므로 루프백에만 바인딩한다.
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - stocknews_net

networks:
  stocknews_net:
    # stockNews(Kotlin) docker-compose가 자동 생성하는 기본 네트워크에 붙어 db:3306으로 접속한다.
    # dev(GCP)/prod 서버 모두 Kotlin 프로젝트가 ~/stockNews에 배포되어 있어 이름은 stocknews_default로 같다.
    # 서버에서 실제 이름은 `docker network ls`로 확인 (프로젝트 폴더명 기준 <폴더명>_default).
    external: true
    name: stocknews_default
