# .github/workflows/deploy.yml
# main → 프로덕션(신규 상용 서버)
#
# 형제 Kotlin 프로젝트(stockNews)의 deploy.yml과 동일한 구조로 맞췄다:
#  - 이미지에 커밋 SHA 태그 추가(롤백 가능), .env에 IMAGE_TAG 주입 → compose가 ${IMAGE_TAG} 참조
#  - environment: main (Environment secrets / 승인 게이트)
#  - concurrency (연속 push 시 이전 배포 취소)
#  - 헬스체크 (컨테이너만 뜨고 앱이 죽은 상태를 잡음)
#  - SCHEDULER_ENABLED=true ← 수집/정리 cron은 상용에서만 돈다(dev는 deploy-dev.yml에서 false)
#
# 서버에 이 저장소를 clone해 둘 필요는 없다. docker-compose.yml을 SSH 스크립트가 직접 써서
# 이미지만 pull 하는 self-contained 방식(기존 방식 유지).

name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kimjiseung97/stock-news-schedule

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: main        # ← Environment secrets + 승인 게이트
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ghcr.io/kimjiseung97/stock-news-schedule
          IMAGE_TAG: ${{ github.sha }}
          # stockNews(Kotlin) compose가 띄운 mariadb 컨테이너에 도커 내부 네트워크로 접속한다.
          # DB_USERNAME / DB_PASSWORD / DB_NAME은 같은 DB이므로 Kotlin 쪽 main environment secrets와 같은 값이어야 함.
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          SCHEDULER_ENABLED: "true"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 2222
          command_timeout: 40m
          envs: IMAGE,IMAGE_TAG,DB_USERNAME,DB_PASSWORD,DB_NAME,NAVER_NEWS_CLIENT_ID,NAVER_NEWS_CLIENT_SECRET,SCHEDULER_ENABLED
          script: |
            set -e
            mkdir -p ~/stock-news-schedule
            cd ~/stock-news-schedule

            # 따옴표 heredoc이라 ${IMAGE_TAG} 등은 치환되지 않고 그대로 파일에 남는다(compose가 .env로 해석).
            cat > docker-compose.yml <<'COMPOSE_EOF'
            x-logging: &default-logging
              driver: json-file
              options:
                max-size: "10m"
                max-file: "3"

            services:
              app:
                image: ${IMAGE:-ghcr.io/kimjiseung97/stock-news-schedule}:${IMAGE_TAG:-latest}
                restart: unless-stopped
                logging: *default-logging
                environment:
                  TZ: Asia/Seoul
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:4000:4000"
                networks:
                  - stocknews_net

            networks:
              stocknews_net:
                external: true
                name: stocknews_default
            COMPOSE_EOF

            # .env에 DB 비밀번호/네이버 API 시크릿이 들어가므로 소유자만 읽도록 생성한다(기본 umask면 0644).
            umask 077
            cat > .env <<EOF
            IMAGE=$IMAGE
            IMAGE_TAG=$IMAGE_TAG
            DATABASE_URL=mysql://$DB_USERNAME:$DB_PASSWORD@db:3306/$DB_NAME
            NAVER_NEWS_CLIENT_ID=$NAVER_NEWS_CLIENT_ID
            NAVER_NEWS_CLIENT_SECRET=$NAVER_NEWS_CLIENT_SECRET
            SCHEDULER_ENABLED=$SCHEDULER_ENABLED
            PORT=4000
            EOF
            chmod 600 .env
            umask 022

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then
                echo "healthy"; exit 0
              fi
              sleep 2
            done
            echo "::error::health check failed"
            docker compose logs --tail=80
            exit 1
