# .github/workflows/deploy-dev.yml
# dev → GCP 개발망
#
# deploy.yml과 구조는 같고 다음만 다름(형제 Kotlin 프로젝트 deploy-dev.yml과 동일한 규칙):
#  - 트리거: dev 브랜치
#  - 이미지 태그: :dev (prod의 :latest를 덮어쓰지 않음)
#  - environment: development (개발망 전용 secrets, SSH 키 인증 / 기본 포트)
#  - SCHEDULER_ENABLED=false  ← dev/prod가 같은 TB_STOCK_NEWS를 보므로 수집 중복 방지
#  - 승인 게이트 없음

name: Deploy (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kimjiseung97/stock-news-schedule

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ghcr.io/kimjiseung97/stock-news-schedule
          IMAGE_TAG: ${{ github.sha }}
          # 개발망 GCP VM의 stockNews(Kotlin) compose가 띄운 mariadb 컨테이너에 내부 네트워크로 접속한다.
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          # 개발 서버에서는 cron을 등록하지 않는다(필요하면 "true"로 바꿔 일시적으로 켤 것).
          SCHEDULER_ENABLED: "false"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 40m
          envs: IMAGE,IMAGE_TAG,DB_USERNAME,DB_PASSWORD,DB_NAME,NAVER_NEWS_CLIENT_ID,NAVER_NEWS_CLIENT_SECRET,SCHEDULER_ENABLED
          script: |
            set -e
            mkdir -p ~/stock-news-schedule
            cd ~/stock-news-schedule

            # 따옴표 heredoc이라 ${IMAGE_TAG} 등은 치환되지 않고 그대로 파일에 남는다(compose가 .env로 해석).
            cat > docker-compose.yml <<'COMPOSE_EOF'
            x-logging: &default-logging
              driver: json-file
              options:
                max-size: "10m"
                max-file: "3"

            services:
              app:
                image: ${IMAGE:-ghcr.io/kimjiseung97/stock-news-schedule}:${IMAGE_TAG:-dev}
                restart: unless-stopped
                logging: *default-logging
                environment:
                  TZ: Asia/Seoul
                env_file:
                  - .env
                ports:
                  - "127.0.0.1:4000:4000"
                networks:
                  - stocknews_net

            networks:
              stocknews_net:
                external: true
                name: stocknews_default
            COMPOSE_EOF

            # .env에 DB 비밀번호/네이버 API 시크릿이 들어가므로 소유자만 읽도록 생성한다(기본 umask면 0644).
            umask 077
            cat > .env <<EOF
            IMAGE=$IMAGE
            IMAGE_TAG=$IMAGE_TAG
            DATABASE_URL=mysql://$DB_USERNAME:$DB_PASSWORD@db:3306/$DB_NAME
            NAVER_NEWS_CLIENT_ID=$NAVER_NEWS_CLIENT_ID
            NAVER_NEWS_CLIENT_SECRET=$NAVER_NEWS_CLIENT_SECRET
            SCHEDULER_ENABLED=$SCHEDULER_ENABLED
            PORT=4000
            EOF
            chmod 600 .env
            umask 022

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # 개발망 GCP 인스턴스는 기동이 느려 prod(60초)보다 길게 잡는다(Kotlin deploy-dev.yml과 동일).
            for i in $(seq 1 90); do
              if curl -fsS http://localhost:4000/health > /dev/null 2>&1; then
                echo "healthy"; exit 0
              fi
              sleep 2
            done
            echo "::error::health check failed"
            docker compose logs --tail=80
            exit 1
